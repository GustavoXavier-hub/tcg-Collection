plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gustavo.tcgcollection'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gustavo.tcgcollection'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Imagens da persona (anime/fan art) ficam fora do Git, em res-local/.
    // Se a pasta não existir, o app compila igual e usa o estilingue (ver PersonaImagens).
    sourceSets {
        main.res.srcDirs += 'src/main/res-local'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Leitura do código pela câmera — mesmas versões da Estante.
    // ML Kit "bundled": o modelo vai dentro do APK, funciona offline e sem custo.
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    testImplementation 'junit:junit:4.13.2'
    // org.json de verdade nos testes (o android.jar só tem stubs)
    testImplementation 'org.json:json:20240303'
}
